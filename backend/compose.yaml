services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATA_DIR: /app/data
      API_KEY: ${API_KEY:-}
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    volumes:
      - fire_data:/app/data
    restart: unless-stopped
volumes:
  fire_data:
